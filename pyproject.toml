[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soif-mcp"
version = "0.1.0"
description = "MCP server exposing soif: estimate the water footprint of LLM prompts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Erwin Lejeune", email = "erwin.lejeune15@gmail.com" }]
keywords = ["mcp", "llm", "water", "sustainability", "footprint", "green-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.0",
    "soif-llm>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Unchained-Labs/soif-mcp"
Repository = "https://github.com/Unchained-Labs/soif-mcp"
Issues = "https://github.com/Unchained-Labs/soif-mcp/issues"
Documentation = "https://unchained-labs.github.io/soif/"

[project.scripts]
soif-mcp = "soif_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soif_mcp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
